<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DANUBIO">
<meta name="theme-color" content="#09090f">
<title>DANUBIO — Eurotour 2027</title>
<style>
:root {
  --bg: #09090f;
  --bg2: #0b0b14;
  --bg3: #0d0d1a;
  --border: #1a1a2a;
  --text: #ddd;
  --muted: #555;
  --dim: #333;
  --red: #e63946;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  overscroll-behavior: none;
}

/* ── HEADER ── */
#hdr {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  background: linear-gradient(var(--bg) 80%, transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hdr-left .sub { font-size: 7px; letter-spacing: 3px; color: var(--red); margin-bottom: 2px; }
.hdr-left .title { font-size: 13px; font-weight: bold; letter-spacing: 2px; }
.hdr-right { text-align: right; font-size: 8px; color: var(--dim); line-height: 1.7; }
.hdr-right .base { color: var(--red); font-size: 8px; }

/* ── MAP AREA ── */
#map-wrap {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 55vh;
  background: var(--bg);
  overflow: hidden;
  touch-action: none;
}
.grid-bg {
  position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(#0e0e1c 1px,transparent 1px),linear-gradient(90deg,#0e0e1c 1px,transparent 1px);
  background-size: 40px 40px;
}
#europe-svg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}
.country {
  fill: #131320; stroke: #222238; stroke-width: 0.7;
  transition: fill .2s, stroke .2s;
}

/* ── BOTTOM SHEET ── */
#sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(48vh + var(--safe-bot));
  background: var(--bg2);
  border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  will-change: transform;
}
#sheet.expanded {
  transform: translateY(calc(-42vh));
}
#sheet-handle {
  flex-shrink: 0;
  padding: 10px 0 6px;
  display: flex;
  justify-content: center;
  cursor: pointer;
  touch-action: none;
}
#sheet-handle::before {
  content: '';
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
}
#sheet-header {
  flex-shrink: 0;
  padding: 0 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
#sheet-title { font-size: 9px; letter-spacing: 2px; color: var(--dim); }
#sheet-count { font-size: 9px; color: var(--dim); }
#sheet-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 10px 14px calc(var(--safe-bot) + 10px);
}
#sheet-body::-webkit-scrollbar { display: none; }

/* ── COUNTRY LIST ── */
.c-item {
  padding: 12px 14px;
  margin-bottom: 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg3);
  cursor: pointer;
  transition: border-color .15s;
  -webkit-user-select: none;
}
.c-item:active { background: #111122; }
.c-flag { font-size: 22px; flex-shrink: 0; }
.c-info { flex: 1; min-width: 0; }
.c-name { font-size: 13px; font-weight: bold; }
.c-city { font-size: 10px; color: var(--muted); margin-top: 2px; }
.c-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.c-tag { font-size: 7px; padding: 2px 8px; letter-spacing: 1px; border-radius: 3px; white-space: nowrap; }
.c-count { font-size: 11px; color: var(--dim); }

/* ── DETAIL VIEW ── */
#detail {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 200;
  background: var(--bg);
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  display: flex;
  flex-direction: column;
  will-change: transform;
}
#detail.open { transform: translateX(0); }

#detail-nav {
  flex-shrink: 0;
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
#back-btn {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 4px 8px 4px 0;
  font-family: 'Courier New', monospace;
  display: flex; align-items: center; gap: 6px;
  -webkit-user-select: none;
}
#back-btn:active { color: var(--text); }
#back-btn span { font-size: 10px; letter-spacing: 1px; }
#detail-flag { font-size: 24px; }
#detail-title { flex: 1; }
#detail-name { font-size: 15px; font-weight: bold; }
#detail-city { font-size: 10px; color: var(--muted); margin-top: 1px; }
#detail-tag { font-size: 8px; letter-spacing: 1px; padding: 3px 10px; border-radius: 3px; flex-shrink: 0; }

#detail-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px 16px calc(var(--safe-bot) + 20px);
}
#detail-body::-webkit-scrollbar { display: none; }

#opp-label { font-size: 8px; letter-spacing: 3px; color: var(--dim); margin-bottom: 12px; }

.opp {
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg3);
}
.opp-type { font-size: 9px; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
.opp-name { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #e0e0e0; }
.opp-desc { font-size: 11px; color: #777; line-height: 1.8; margin-bottom: 10px; }
.opp-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; text-decoration: none; padding: 6px 12px;
  border-radius: 4px; border: 1px solid;
  -webkit-user-select: none;
}
.opp-link:active { opacity: .7; }

/* ── MAP HINT ── */
#map-hint {
  position: fixed;
  bottom: calc(48vh + 8px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  letter-spacing: 1px;
  color: #282838;
  pointer-events: none;
  white-space: nowrap;
  z-index: 60;
}
</style>

// ── INIT ──
const CZdot = COUNTRIES.CZ.dot;
let sel = null;
const tot = Object.values(COUNTRIES).reduce((a,c)=>a+c.opportunities.length,0);
document.getElementById('hcount').textContent = Object.keys(COUNTRIES).length+' países';
document.getElementById('sheet-count').textContent = tot+' oportunidades';

function ns(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
const lG=document.getElementById('lines-g');
const dG=document.getElementById('dots-g');

// Lines from Prague
Object.entries(COUNTRIES).forEach(([k,c])=>{
  if(k==='CZ')return;
  const l=ns('line');
  l.setAttribute('x1',CZdot.x);l.setAttribute('y1',CZdot.y);
  l.setAttribute('x2',c.dot.x);l.setAttribute('y2',c.dot.y);
  l.setAttribute('stroke',c.tagColor);l.setAttribute('stroke-dasharray','6 5');
  l.setAttribute('stroke-width','1');l.setAttribute('opacity','0.1');
  l.id='ln-'+k; lG.appendChild(l);
});

// Dots
Object.entries(COUNTRIES).forEach(([k,c])=>{
  const g=ns('g'); g.id='dg-'+k;
  const pulse=ns('circle');
  pulse.setAttribute('cx',c.dot.x);pulse.setAttribute('cy',c.dot.y);pulse.setAttribute('r','16');
  pulse.setAttribute('fill','none');pulse.setAttribute('stroke',c.tagColor);
  pulse.setAttribute('stroke-width','1');pulse.setAttribute('opacity','0');pulse.id='pu-'+k;
  const dot=ns('circle');
  dot.setAttribute('cx',c.dot.x);dot.setAttribute('cy',c.dot.y);dot.setAttribute('r','7');
  dot.setAttribute('fill',c.tagColor);dot.setAttribute('stroke','rgba(255,255,255,0.2)');
  dot.setAttribute('stroke-width','1.5');dot.id='dt-'+k;
  dot.style.filter='drop-shadow(0 0 6px '+c.tagColor+'99)';
  const txt=ns('text');
  txt.setAttribute('x',c.dot.x);txt.setAttribute('y',c.dot.y+19);
  txt.setAttribute('text-anchor','middle');txt.setAttribute('fill','#484858');
  txt.setAttribute('font-size','7');txt.setAttribute('font-family','Courier New,monospace');
  txt.style.pointerEvents='none'; txt.id='lb-'+k;
  txt.textContent=c.flag+' '+c.city.split('/')[0].trim();
  g.appendChild(pulse);g.appendChild(dot);g.appendChild(txt);
  g.addEventListener('click',e=>{e.stopPropagation();tapCountry(k);});
  dG.appendChild(g);
});

// Shape clicks
Object.entries(COUNTRIES).forEach(([k,c])=>{
  const s=document.getElementById(c.shapeId);
  if(s) s.addEventListener('click',()=>tapCountry(k));
});

function tapCountry(k) {
  sel = (sel===k) ? null : k;
  updateMap();
  if(sel) openDetail(sel);
}

function updateMap() {
  Object.entries(COUNTRIES).forEach(([k,c])=>{
    const s=document.getElementById(c.shapeId);
    if(s){
      if(sel===k){s.style.fill=c.tagColor+'2e';s.style.stroke=c.tagColor;s.style.strokeWidth='1.5';}
      else{s.style.fill='';s.style.stroke='';s.style.strokeWidth='';}
    }
    const dt=document.getElementById('dt-'+k);
    const pu=document.getElementById('pu-'+k);
    const lb=document.getElementById('lb-'+k);
    const ln=document.getElementById('ln-'+k);
    if(sel===k){
      dt.setAttribute('r','11');dt.setAttribute('stroke','rgba(255,255,255,0.6)');
      dt.style.filter='drop-shadow(0 0 14px '+c.tagColor+')';
      pu.setAttribute('opacity','0.4');lb.setAttribute('fill',c.tagColor);
      if(ln)ln.setAttribute('opacity','0.6');
    }else{
      dt.setAttribute('r','7');dt.setAttribute('stroke','rgba(255,255,255,0.2)');
      dt.style.filter='drop-shadow(0 0 6px '+c.tagColor+'99)';
      pu.setAttribute('opacity','0');lb.setAttribute('fill','#484858');
      if(ln)ln.setAttribute('opacity','0.1');
    }
  });
}

// ── DETAIL PANEL ──
function openDetail(k) {
  const c = COUNTRIES[k];
  document.getElementById('detail-flag').textContent = c.flag;
  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-city').textContent = c.city;
  const tag = document.getElementById('detail-tag');
  tag.textContent = c.tag;
  tag.style.color = c.tagColor;
  tag.style.border = '1px solid '+c.tagColor;
  document.getElementById('opp-label').textContent = c.opportunities.length+' OPORTUNIDADES';
  document.getElementById('opp-list').innerHTML = c.opportunities.map(o=>
    '<div class="opp" style="border-left:3px solid '+c.tagColor+'55">'
    +'<div class="opp-type">'+o.type+'</div>'
    +'<div class="opp-name">'+o.name+'</div>'
    +'<div class="opp-desc">'+o.desc+'</div>'
    +'<a href="'+o.link+'" target="_blank" rel="noopener noreferrer" class="opp-link" style="color:'+c.tagColor+';border-color:'+c.tagColor+'44;background:'+c.tagColor+'11">→ abrir sitio</a>'
    +'</div>'
  ).join('');
  document.getElementById('detail-body').scrollTop = 0;
  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  sel = null;
  updateMap();
}

// ── SHEET LIST ──
function renderList() {
  let h='';
  Object.entries(COUNTRIES).forEach(([k,c])=>{
    h+='<div class="c-item" onclick="tapCountry(\''+k+'\')" style="border-color:var(--border)">'
      +'<span class="c-flag">'+c.flag+'</span>'
      +'<div class="c-info"><div class="c-name">'+c.name+'</div><div class="c-city">'+c.city+'</div></div>'
      +'<div class="c-right">'
      +'<div class="c-tag" style="color:'+c.tagColor+';border:1px solid '+c.tagColor+'33;background:'+c.tagColor+'11">'+c.tag+'</div>'
      +'<div class="c-count">'+c.opportunities.length+' →</div>'
      +'</div></div>';
  });
  document.getElementById('sb-content').innerHTML = h;
}

// ── SHEET DRAG ──
const sheet = document.getElementById('sheet');
const handle = document.getElementById('sheet-handle');
let startY=0, startT=0, isDragging=false, sheetExpanded=false;

handle.addEventListener('touchstart', e=>{
  startY = e.touches[0].clientY;
  startT = Date.now();
  isDragging = true;
}, {passive:true});

handle.addEventListener('touchmove', e=>{
  if(!isDragging) return;
  const dy = e.touches[0].clientY - startY;
  if(Math.abs(dy)>5) e.preventDefault();
}, {passive:false});

handle.addEventListener('touchend', e=>{
  if(!isDragging) return;
  isDragging = false;
  const dy = e.changedTouches[0].clientY - startY;
  const dt = Date.now() - startT;
  if(dy < -30 || (dy < 0 && dt < 200)) {
    sheet.classList.add('expanded');
    sheetExpanded = true;
  } else if(dy > 30 || (dy > 0 && dt < 200)) {
    sheet.classList.remove('expanded');
    sheetExpanded = false;
  }
}, {passive:true});

// Tap handle = toggle
handle.addEventListener('click', ()=>{
  sheetExpanded = !sheetExpanded;
  sheet.classList.toggle('expanded', sheetExpanded);
});

// ── SWIPE BACK on detail ──
let detailStartX = 0;
const detailEl = document.getElementById('detail');
detailEl.addEventListener('touchstart', e=>{
  detailStartX = e.touches[0].clientX;
}, {passive:true});
detailEl.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - detailStartX;
  if(dx > 60) closeDetail();
}, {passive:true});

// ── START ──
renderList();
</script>
